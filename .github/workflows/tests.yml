name: Project checks

on:
  push:
    branches: [main, assessment-improvements, research-grade-wqi-upgrade]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run complete experiment
        run: python run_experiments.py --data DOC-20261117-WA0000.csv
      - name: Run external dataset analysis
        run: python analyze_external_dataset.py
      - name: Verify external analysis outputs
        run: |
          test -s outputs/external_dataset/external_wqi_intervals.csv
          test -s outputs/external_dataset/external_yearly_summary.csv
          test -s outputs/external_dataset/external_dataset_summary.txt
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: wqi-experiment-outputs
          path: outputs/

      - name: Commit reproducible experiment outputs
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/regression_A.csv outputs/regression_B.csv outputs/classification_A.csv outputs/classification_B.csv outputs/selected_hyperparameters.csv outputs/error_by_station_B.csv outputs/error_by_category_B.csv outputs/run_summary.txt
          git diff --cached --quiet || git commit -m "Store reproducible experiment outputs"
          git push
